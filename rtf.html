<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Text</title>
    <link rel="stylesheet" href="ro.css">
</head>
<body>

    <h1>Image Text</h1>

    <div class="grid">

        <div class="section">
            <h3>Center:</h3>
            <div class="container">
                <img src="mountain.jpg" alt="mountain">
                <p class="center">Centered</p>
            </div>
        </div>

        <div class="section">
            <h3>Bottom Right:</h3>
            <div class="container">
                <img src="mountain.jpg" alt="mountain">
                <p class="bottom-right">Bottom Right</p>
            </div>
        </div>

        <div class="section">
            <h3>Top Right:</h3>
            <div class="container">
                <img src="mountain.jpg" alt="mountain">
                <p class="top-right">Top Right</p>
            </div>
        </div>

        <div class="section">
            <h3>Bottom Left:</h3>
            <div class="container">
                <img src="mountain.jpg" alt="mountain">
                <p class="bottom-left">Bottom Left</p>
            </div>
        </div>

        <div class="section">
            <h3>Top Left:</h3>
            <div class="container">
                <img src="mountain.jpg" alt="mountain">
                <p class="top-left">Top Left</p>
            </div>
        </div>

    </div>

    <div class="welcome-bar">
        <p>Hello Welcome to my Website</p>
    </div>

</body>
</html>
